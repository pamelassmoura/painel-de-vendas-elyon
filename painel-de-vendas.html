<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.wrap{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}

.mu{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}

.x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}

.tag{padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--bd)}

.btn svg{stroke:#1d1d1b!important}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#1d1d1b;font-weight:700}

@keyframes swing{0%,100%{transform:rotate(0)}15%{transform:rotate(20deg)}30%{transform:rotate(-18deg)}45%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}75%{transform:rotate(5deg)}}

.mg{position:relative;overflow:hidden;min-height:150px;border:1px solid var(--ac);background:radial-gradient(circle at 50% 0,#2b2400,transparent 70%),var(--card)}
.mg .ld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:mgOut .5s ease 2.4s forwards}

.mg .bar{width:70%;max-width:260px;height:6px;border-radius:6px;background:#ffffff22;overflow:hidden}
.mg .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),#fff3b0);animation:mgBar 2.3s cubic-bezier(.3,.6,.4,1) forwards}
.mg .rv{opacity:0;transform:translateY(8px) scale(.98);animation:mgIn .7s ease 2.5s forwards}
.mg .st{position:absolute;color:var(--ac);animation:mgTw 1.6s ease-in-out infinite;pointer-events:none}
@keyframes mgBar{to{width:100%}}
@keyframes mgOut{to{opacity:0;visibility:hidden}}
@keyframes mgIn{to{opacity:1;transform:none}}
@keyframes mgSp{0%,100%{transform:rotate(-15deg) scale(1)}50%{transform:rotate(15deg) scale(1.15)}}
@keyframes mgTw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}

#prn{position:fixed;inset:0;background:var(--bg);z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:prnOut .5s ease 2.9s forwards}

#prn .led{animation:prnLed .4s steps(2) infinite}
#prn .tx{font-weight:700;letter-spacing:.3px}
@keyframes prnUp{from{transform:translateY(34px)}to{transform:translateY(-62px)}}
@keyframes prnLn{to{transform:scaleX(1)}}
@keyframes prnVib{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes prnLed{0%{opacity:1}100%{opacity:.25}}
@keyframes prnOut{to{opacity:0;visibility:hidden}}

#gate{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;overflow-x:hidden;padding:44px 24px}

#gate .card:not(.mg){background:none;border:0;padding:0;margin:0}

#gate .row{flex-direction:column;align-items:stretch;gap:14px}
#gate label{flex:none;font-size:13px}
#gate input,#gate select{padding:13px 12px;font-size:16px}
#gate .btn{font-weight:700;width:100%;padding:13px;font-size:15px;letter-spacing:.8px;text-transform:uppercase}

#gate{text-align:center;padding-bottom:420px}
#gate .gl{display:block;width:120px;height:auto;margin:0 auto 22px}
#gate .gw>.card{border:0!important;background:none!important;box-shadow:none;text-align:center}
#gate .gw>.card h2{margin-bottom:4px}
#gate .gw>.card.mg{min-height:170px}
#pinpop{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-bottom:0;border-radius:18px 18px 0 0;padding:20px 22px 24px;z-index:95;box-shadow:0 -12px 40px #000c;text-align:left;animation:popUp .55s cubic-bezier(.2,.8,.2,1) both}
#pinpop h2{text-align:center}
@keyframes popUp{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}

#gate{padding-top:26px}
#gate .gl{width:84px;margin-bottom:12px}
#gate .gh{font-size:27px;margin-bottom:10px}
#gate .gw>.card.mg{min-height:140px;margin-bottom:0}
#pinpop{padding:16px 20px 18px}
#pinpop .row{gap:8px}
#pinpop label{font-size:12px}
#pinpop input,#pinpop select{padding:9px 11px;font-size:15px}
#pinpop .btn{padding:11px}
#pinpop .mu{font-size:11px;margin-top:2px!important}
#pinpop h2{margin-bottom:8px!important}
@keyframes popS{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

#gate.nr{padding-bottom:40px}
#pinpop.near{position:static;transform:none;margin:8px auto 0;max-width:420px;border:1px solid var(--bd);border-radius:18px;box-shadow:0 10px 36px #0008;animation:nearIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes nearIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes tcPop{0%{transform:scale(.3) translateY(30px);opacity:0}60%{transform:scale(1.15) translateY(-6px);opacity:1}100%{transform:none}}
@keyframes tcShine{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes tcFall{0%{transform:translateY(-14px) rotate(0);opacity:1}100%{transform:translateY(230px) rotate(360deg);opacity:0}}
@keyframes tcRing{0%{box-shadow:0 0 0 0 #f5b30088}100%{box-shadow:0 0 0 16px #f5b30000}}
.tc{position:relative;overflow:hidden}.tc .cf{position:absolute;top:0;width:8px;height:12px;border-radius:2px;animation:tcFall 2.8s linear infinite;pointer-events:none}
.tc .ph{width:92px;height:92px;border-radius:50%;border:2px solid var(--ac);background:#1d1d1b;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:var(--ac);overflow:hidden;animation:tcRing 1.8s ease-out infinite}
.tc .ph img{width:100%;height:100%;object-fit:cover}
.tc .tr{position:absolute;right:-14px;bottom:-10px;width:44px;height:44px;border-radius:50%;background:var(--ac);color:#1d1d1b;display:flex;align-items:center;justify-content:center;font-size:24px;animation:tcPop .9s ease-out both,tcShine 2.4s ease-in-out .9s infinite}
.tc .tr svg{stroke:#1d1d1b!important}.tc .st{background:#1d1d1b;border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
@media(prefers-reduced-motion:reduce){.tc *{animation:none!important}}
.chip{display:inline-flex;width:26px;height:26px;border-radius:7px;background:#1d1d1b;border:1px solid var(--bd);align-items:center;justify-content:center;vertical-align:middle;margin-left:6px}
.chip svg{flex:none;min-width:16px;width:16px!important;height:16px!important;fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip:hover{border-color:var(--ac)}
.chip img{width:24px;height:24px;object-fit:cover;border-radius:6px;display:block}

:root{--mu:#b9b9b3;--ic:#fab800}
h1{font:italic 900 26px/1.15 "Playfair Display",Georgia,serif;color:var(--ac)}
h2{font:italic 900 18px/1.25 "Playfair Display",Georgia,serif;margin:0 0 10px}
header{align-items:flex-start}
.hbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hb,#duvb{border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.hb:hover,#duvb:hover{color:var(--tx)}.hb.on,#duvb.on{color:var(--tx);border-color:var(--ac)}

nav{gap:2px;border-bottom:1px solid var(--bd);margin-bottom:16px}
nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mu);padding:9px 13px;margin-bottom:-1px}
nav button:hover{color:var(--tx)}
nav button.on{background:none;border-bottom-color:var(--ac);color:var(--tx);font-weight:700}
svg[stroke]{stroke:var(--ic)!important}
.btn svg,.tc .tr svg{stroke:#1d1d1b!important}
.btn.dg svg{stroke:#fff!important}
.kp .card{padding:16px 18px}.kp .v{font-size:30px;font-weight:700;letter-spacing:-.5px;margin-top:4px}.kp .k{font-size:13px}
.kl{color:var(--mu);font-size:13px;margin:-4px 2px 16px}
.pill{font-size:11.5px;padding:2px 9px;border-radius:999px;white-space:nowrap}.pill.ok{background:#4cd07d24;color:var(--ok)}.pill.wr{background:#ffb02024;color:var(--warn)}
.sv td{vertical-align:top}.sv .ex td{background:#ffffff08;white-space:normal}
.xg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;padding:6px 2px}.xg .k{margin-bottom:2px}
.cv{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px;padding:4px 8px;transition:transform .15s}.cv.o{transform:rotate(180deg)}
.btn.dg{background:#7f1d1d;color:#fff}.btn.dg svg{stroke:#fff!important}
.tc{border-color:var(--ac)}.tc .ph{width:72px;height:72px;font-size:28px}.tc .tr{width:36px;height:36px;font-size:20px;right:-10px;bottom:-8px}
@media(max-width:640px){.wrap{padding:12px}h1{font-size:21px}.kp .v{font-size:24px}.hbs{width:100%}nav button{padding:8px 10px;font-size:14px}.sv th:nth-child(1),.sv td:nth-child(1){display:none}.xg{grid-template-columns:1fr 1fr}}

.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:720px;margin:24px auto}
.hub button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:22px;cursor:pointer;font:inherit;transition:border-color .15s,transform .15s}
.hub button:hover{border-color:var(--ac);transform:translateY(-2px)}
.hub .hi{width:52px;height:52px;border-radius:14px;background:#1d1d1b;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:26px}
.hub .ht{font:italic 900 20px/1.2 "Playfair Display",Georgia,serif}
.hub .hd{color:var(--mu);font-size:13.5px}
.hub .soon{font-size:11.5px;padding:2px 9px;border-radius:999px;background:#ffffff14;color:var(--mu)}
</style></head>
<body><div class="wrap">
<header><div><h1>Painel de vendas</h1><div class="mu">Elyon · Mais que uma gráfica</div><div class="mu" id="st">Carregando…</div></div>
<div class="hbs"><button class="hb" id="homeb" onclick="goApp('')" style="display:none">🏠 Início</button><button class="hb" id="fltb" onclick="toggleFlt()">🎚 Filtros</button><button class="hb" id="repb0" onclick="repOpen()">📋 Relatório</button><button id="duvb" onclick="tab='duv';render()" title="Dúvidas">❓ Dúvidas</button><button class="hb" id="snd" onclick="toggleSnd()">🔔 Som</button></div></header>
<div id="flt" class="card" style="display:none"><div class="row"><label>📡 Canal<select id="canal"><option value="todos">Todos</option><option value="inbound">Inbound (todos)</option><option value="inbound_site">Inbound site</option><option value="inbound_instagram">Inbound Instagram</option><option value="outbound">Outbound</option></select></label><label>👤 Cliente<select id="tipo"><option value="todos">Todos</option><option value="novo">Novos</option><option value="recorrente">Recorrentes</option></select></label><label>🧑‍💼 Vendedor<select id="vend"></select></label><label>📅 Mês<input type="month" id="mes"></label></div></div>
<nav id="nav"></nav>
<div id="app"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dbr=d=>d?d.split('-').reverse().join('/'):'';
const today=()=>new Date().toLocaleDateString('sv');
const cl=o=>o==null?o:JSON.parse(JSON.stringify(o));
let S={sales:[],quotes:[],goals:{revenue:0,newClients:0,conversion:0}};
let ref=null,month=today().slice(0,7),tab='resumo',chan='todos',tipo='todos',vend='todos';
const SELLERS=['Pamela','Celiane','Aline','Kamila','Thiago'];
const sellerOpts=()=>SELLERS.map(n=>`<option>${n}</option>`).join('');
const MOTIVOS=['Objeção de preço','Prazo de entrega','Fechou com concorrente','Sem retorno do cliente','Decisão adiada','Sem budget','Condição de pagamento','Especificação / escopo','Lead desqualificado','Outro'];
const TABS=[['resumo','📊 Resumo'],['orc','📝 Orçamentos'],['vendas','🧾 Vendas'],['cli','🏢 Clientes'],['prod','📦 Produtos'],['port','🖼 Portfólio'],['metas','🎯 Metas']];

async function save(){
  try{
    if(ref)await ref.set(JSON.parse(JSON.stringify(S)));else localStorage.setItem('painel',JSON.stringify(S));
    $('#st').textContent='Salvo';
  }catch(e){$('#st').textContent='Não foi possível salvar'}
}
let V={sales:[],quotes:[],goals:[]},ALL={},ME={u:null,admin:false},LOADED=false,CAT=[],CATREF=null,CATCOL=null,AS=null,OPEN=null,CLI={},CQ='',IMG={},DBH=null,UNLOCKED=false;
const rate=v=>((v._rate!=null?+v._rate:+S.rate)||0)/100;
const own=r=>r._u===(ME.u||'me');
const idle=()=>{const a=document.activeElement;return !(a&&$('#app').contains(a)&&/INPUT|SELECT/.test(a.tagName))};
function build(){
  const docs=ME.admin&&ME.u?Object.assign({},ALL,{[ME.u]:S}):{[ME.u||'me']:S};
  const o={sales:[],quotes:[],goals:[],prospects:[]};
  Object.keys(docs).forEach(u=>{const d=docs[u],nm=d.seller||'Pamela',rt=d.rate==null?3:+d.rate;
    (d.sales||[]).forEach(r=>o.sales.push(Object.assign({},r,{seller:d.seller||r.seller||nm,_u:u,_rate:rt,paid:isPaid(r)})));
    (d.quotes||[]).forEach(r=>o.quotes.push(Object.assign({},r,{seller:d.seller||r.seller||nm,_u:u})));
    (d.prospects||[]).forEach(r=>o.prospects.push(Object.assign({},r,{seller:d.seller||nm,_u:u,_pg:+d.pgoal||40})));
    o.goals.push({seller:nm,g:d.goals||{}})});
  return o;
}
function goalsView(){
  const t={revenue:0,newClients:0,conversion:0};let n=0;
  V.goals.filter(x=>vend==='todos'||x.seller===vend).forEach(x=>{t.revenue+=+x.g.revenue||0;t.newClients+=+x.g.newClients||0;t.conversion+=+x.g.conversion||0;n++});
  if(n>1)t.conversion=Math.round(t.conversion/n);
  return t;
}
const sha=async t=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('painel:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa(unescape(encodeURIComponent('painel:'+t)))}};

function msgCard(kind){
  const h=new Date().getHours(),g=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',nm=S.seller?', '+esc(S.seller):'';
  const d=Math.floor(new Date(today()+'T12:00:00Z').getTime()/864e5);
  let step=SELLERS.length+1;while(gcd(step,QUO.length)!==1)step++;
  let k=SELLERS.indexOf(S.seller);if(k<0)k=SELLERS.length;
  const q=QUO[(d*step+k)%QUO.length];
  const inner=`<h2>✨ ${g}${nm}!</h2><div class="mu">Mensagem do dia</div><div style="font-size:17px;font-style:italic;margin:6px 0">“${esc(q[0])}”</div><div style="color:var(--ac);font-weight:700">— ${esc(q[1])}</div>`;
  if(MG[kind]||!kind)return `<div class="card" style="border:1px solid var(--ac)">${inner}</div>`;
  MG[kind]=1;
  const sp=[[8,12],[88,18],[20,78],[78,70],[92,60],[5,55]].map((p,n)=>`<span class="st" style="left:${p[0]}%;top:${p[1]}%;animation-delay:${n*.23}s;font-size:${12+n%3*5}px">✦</span>`).join('');
  return `<div class="card mg">${sp}<div class="ld"><div class="wand">✨</div><div style="font-weight:700">Preparando sua mensagem do dia…</div><div class="bar"><i></i></div></div><div class="rv">${inner}</div></div>`;
}

function gateView0(){
  if(!S.seller||!S.pin)return `<div class="card"><h2>🔐 Primeiro acesso</h2><div class="row">${S.seller?`<div><b>${esc(S.seller)}</b></div>`:`<label>Vendedor<select id="who">${sellerOpts()}</select></label>`}<label>Crie um PIN<input type="password" id="p1" autocomplete="new-password"></label><label>Repita o PIN<input type="password" id="p2" autocomplete="new-password" onkeydown="if(event.key==='Enter')setupAcc()"></label><button class="btn" onclick="setupAcc()">Salvar e entrar</button></div><div class="mu" style="margin-top:6px">Use 4 ou mais caracteres. Você vai digitar este PIN sempre que abrir o painel.</div></div>`;
  return `<div class="card"><h2>🔐 ${esc(S.seller)}, digite seu PIN</h2><div class="row"><label>PIN<input type="password" id="p0" onkeydown="if(event.key==='Enter')tryPin()"></label><button class="btn" onclick="tryPin()">Entrar</button></div></div>`;
}
async function setupAcc(){
  const w=$('#who'),p=$('#p1').value;
  if(p.length<4||p!==$('#p2').value){toast('Crie um PIN com 4 ou mais caracteres e repita o mesmo na confirmação.');return}
  if(!S.seller&&w)S.seller=w.value;
  S.pin=await sha(p);UNLOCKED=true;save();$('#st').textContent=S.seller+(ME.admin?' · visão geral da equipe':'');printAnim(render);
}

let PRN=0;
function printAnim(done){
  if(PRN)return;PRN=1;
  const lines=[[14,22,.6,'#1d1d1b'],[14,32,.9,'#555'],[14,42,.75,'#555'],[14,52,.85,'#555'],[14,62,.5,'#fab800']].map((l,n)=>`<rect class="ln" x="${l[0]}" y="${l[1]}" width="${l[2]*72}" height="5" rx="2" fill="${l[3]}" style="animation-delay:${.9+n*.35}s"/>`).join('');
  const o=document.createElement('div');o.id='prn';
  o.innerHTML=`<svg viewBox="0 0 200 170" aria-hidden="true">
    <g class="sheet"><rect x="52" y="40" width="96" height="86" rx="3" fill="#fff"/><g transform="translate(46,30) scale(1)">${lines}</g></g>
    <g class="body"><rect x="14" y="108" width="172" height="48" rx="10" fill="#fab800"/><rect x="14" y="108" width="172" height="12" rx="6" fill="#d99c00"/><rect x="40" y="112" width="120" height="6" rx="3" fill="#1d1d1b"/><rect x="30" y="156" width="140" height="6" rx="3" fill="#3a3a37"/><circle class="led" cx="168" cy="138" r="4" fill="#1d1d1b"/><rect x="28" y="132" width="40" height="8" rx="3" fill="#1d1d1b" opacity=".25"/></g>
  </svg><div class="tx">Imprimindo seu painel…</div>`;
  document.body.appendChild(o);
  setTimeout(()=>{o.remove();PRN=0;done()},3400);
}
async function tryPin(){if((await sha($('#p0').value))===S.pin){UNLOCKED=true;$('#st').textContent=S.seller+(ME.admin?' · visão geral da equipe':'');printAnim(render)}else toast('PIN incorreto.')}
function pinCard(){
  const adm=ME.admin?`<div class="card"><h2>👥 Acessos da equipe</h2>${Object.keys(ALL).filter(u=>u!==ME.u).map(u=>`<div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${esc(ALL[u].seller||'Sem nome')}${ALL[u].pin?'':' <span class="mu">(sem PIN)</span>'}</span><button class="btn" onclick="resetPin('${u}')">Redefinir PIN</button></div>`).join('')||'<div class="mu">Nenhum outro vendedor ainda.</div>'}</div>`:'';
  return `<div class="card"><h2>🔑 Meu PIN de acesso</h2><div class="row"><label>Novo PIN<input type="password" id="np1"></label><label>Repetir<input type="password" id="np2"></label><button class="btn" onclick="changePin()">Alterar PIN</button></div></div>${adm}`;
}
async function changePin(){const a=$('#np1').value;if(a.length<4||a!==$('#np2').value){toast('Use 4 ou mais caracteres e repita igual.');return}S.pin=await sha(a);save();toast('PIN alterado.');render()}
function resetPin(u){ask('Redefinir o PIN deste vendedor? Ele criará um novo no próximo acesso.',async()=>{try{await DBH.collection('vendas').doc(u).update({pin:''})}catch(e){toast('Não foi possível redefinir.')}})}
function nextId(){let n=CAT.length+1;const ids=new Set(CAT.map(p=>p.id));while(ids.has('P'+String(n).padStart(3,'0')))n++;return 'P'+String(n).padStart(3,'0')}
function vProd(){
  return seedCard()+`<div class="card"><h2>📦 Cadastrar produto</h2><div class="row">
  <label>ID<input id="pi" value="${nextId()}"></label>
  <label>Produto<input id="pn" placeholder="Ex.: Caixa personalizada"></label>
  <label>Preço padrão (R$)<input type="number" step="0.01" min="0" id="pp"></label>
  <label>Foto de referência<input type="file" id="pf" accept="image/*"></label>
  <button class="btn" onclick="addProd()">Adicionar</button></div>
  <div class="mu" style="margin-top:6px">Os vendedores escolhem o produto pelo ID ao lançar uma venda e veem a miniatura da foto. O preço é opcional e preenche o valor automaticamente.</div></div>
  <div class="card"><h2>🗂 Produtos cadastrados (${CAT.length})</h2><div class="tw">${CAT.length?`<table><tr><th>Foto</th><th>ID</th><th>Produto</th><th>Preço padrão</th><th></th></tr>${CAT.map(p=>`<tr><td>${thumb(p.id,48)}</td><td>${esc(p.id)}</td><td>${esc(p.name)}</td><td>${p.price?brl(p.price):'—'}</td><td><label class="btn" style="display:inline-block;padding:5px 10px;font-size:12px;cursor:pointer">${IMG[p.id]?'Trocar foto':'Adicionar foto'}<input type="file" accept="image/*" style="display:none" onchange="changeImg('${p.id}',this)"></label> <button class="x" onclick="delProd('${p.id}')" title="Excluir">✕</button></td></tr>`).join('')}</table>`:'<div class="mu">Nenhum produto cadastrado.</div>'}</div></div>`;
}
async function addProd(){
  const id=$('#pi').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,''),name=$('#pn').value.trim(),price=parseFloat($('#pp').value)||0;
  if(!id||!name){toast('Informe o ID e o nome do produto.');return}
  if(CAT.some(p=>p.id===id)){toast('Já existe um produto com esse ID.');return}
  const f=$('#pf').files[0];let img='';
  if(f){try{img=await readImg(f)}catch(e){toast('Não foi possível ler a imagem. Tente outro arquivo.');return}}
  CAT.push({id,name,price});if(img)await saveImg(id,img);await saveCat();render();
}
function delProd(id){ask('Excluir este produto do cadastro? As vendas já lançadas continuam com o nome dele.',()=>{CAT=CAT.filter(p=>p.id!==id);delImg(id);saveCat();render()})}
function safeId(x){return /^[A-Za-z0-9_-]{8,64}$/.test(x||'')}
function attCell(r){
  const fs=r.files||[];
  const links=fs.map((f,i)=>safeId(f.id)?`<div style="display:flex;gap:6px;align-items:center"><a href="/_blob/${f.id}" target="_blank" rel="noopener" style="color:var(--ac)" title="${esc(f.name||'')}">Rev. ${i+1} ↗</a>${own(r)?`<button class="x" style="font-size:13px" onclick="delAtt(${r.id},${i})" title="Remover">✕</button>`:''}</div>`:'').join('');
  const add=own(r)&&AS&&fs.length<3?`<label class="btn" style="display:inline-block;padding:4px 10px;font-size:12px;cursor:pointer;margin-top:3px">+ Anexar<input type="file" accept="application/pdf,image/*" style="display:none" onchange="addAtt(${r.id},this)"></label>`:'';
  return (links||add)?links+add:'—';
}
async function addAtt(id,inp){
  const f=inp.files[0],r=S.sales.find(x=>x.id===id);
  if(!f||!r||!AS)return;
  r.files=r.files||[];
  if(r.files.length>=3){toast('Limite de 3 anexos por venda.');return}
  if(f.size>10*1024*1024){toast('Arquivo muito grande. Use até 10 MB.');return}
  try{const u=await AS.upload(f);r.files.push({id:u.id,name:f.name,at:today()});await save();render()}
  catch(e){toast('Não foi possível enviar o anexo. Use PDF ou imagem (PNG, JPG, WEBP).')}
}
async function delAtt(id,i){
  const r=S.sales.find(x=>x.id===id);
  if(!r||!r.files)return;
  ask('Remover este anexo?',async()=>{const f=r.files.splice(i,1)[0];await save();render();try{if(AS&&f)await AS.delete(f.id)}catch(e){}});
}
const MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mname=k=>MN[+k.slice(5,7)-1]+'/'+k.slice(0,4);
function payMonth(d){let y=+d.slice(0,4),m=+d.slice(5,7);const n=[3,6,9,12].find(x=>x>m);let k;if(n)k=y+'-'+String(n).padStart(2,'0');else k=(y+1)+'-03';return k<'2026-12'?'2026-12':k}
function nextPay(){const t=today();let y=+t.slice(0,4),m=+t.slice(5,7);const n=[3,6,9,12].find(x=>x>=m);let k;if(n)k=y+'-'+String(n).padStart(2,'0');else k=(y+1)+'-03';return k<'2026-12'?'2026-12':k}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card);color:var(--tx);border:1px solid var(--ac);padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw;box-shadow:0 4px 20px #0008';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display='none'},4500)}
function ask(m,fn){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px';o.innerHTML='<div class="card" style="max-width:360px;margin:0"><div id="askm" style="margin-bottom:12px"></div><div class="row" style="justify-content:flex-end"><button class="btn" id="askn" style="background:var(--bd);color:var(--tx)">Cancelar</button><button class="btn" id="asky">Confirmar</button></div></div>';document.body.appendChild(o);o.querySelector('#askm').textContent=m;o.querySelector('#askn').onclick=()=>o.remove();o.querySelector('#asky').onclick=()=>{o.remove();fn()}}

function normUrl(v){v=String(v||'').trim();if(!v)return '';if(!/^https?:\/\//i.test(v))v='https://'+v;try{const x=new URL(v);if(!/^https?:$/.test(x.protocol)||x.hostname.indexOf('.')<0)return null;return x.href}catch(e){return null}}
function netChip(u){const h=normUrl(u);if(!h)return '';let host='';try{host=new URL(h).hostname.toLowerCase()}catch(e){}const n=NET.find(x=>x[1].test(host)),name=n?n[0]:'Site',ic=n?n[2]:NETSITE;return `<a class="chip" href="${esc(h)}" target="_blank" rel="noopener noreferrer" title="${name}: abrir perfil" aria-label="${name}"><svg viewBox="0 0 24 24" aria-hidden="true">${ic}</svg></a>`}
function cliBadge(c){if(!c)return '';const h=c.social?normUrl(c.social):'';if(c.logo){const im=`<img src="${esc(c.logo)}" alt="">`;return h?`<a class="chip" href="${esc(h)}" target="_blank" rel="noopener noreferrer" title="Abrir perfil">${im}</a>`:`<span class="chip">${im}</span>`}return c.social?netChip(c.social):''}
const areaOf=r=>{const c=r&&r.cnpj?CLI[r.cnpj]:null;if(!c)return '';const x=(c.area?esc(c.area):'')+cliBadge(c);return x?`<div class="mu">${x}</div>`:''};
const dig=v=>String(v||'').replace(/\D/g,'');
function fmtCnpj(v){const d=dig(v);if(d.length===11)return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4');return d.length===14?d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):String(v||'')}
function okCnpj(v){const c=dig(v);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const f=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return f(12)===+c[12]&&f(13)===+c[13]}
function okCpf(v){const c=dig(v);if(c.length!==11||/^(\d)\1+$/.test(c))return false;const f=n=>{let t=0;for(let i=0;i<n;i++)t+=+c[i]*(n+1-i);const r=(t*10)%11;return r===10?0:r};return f(9)===+c[9]&&f(10)===+c[10]}
function okDoc(v){const c=dig(v);return c.length===11?okCpf(c):c.length===14?okCnpj(c):false}
function maskCnpj(el){const d=dig(el.value).slice(0,14);let o='';if(d.length<=11){for(let i=0;i<d.length;i++){o+=d[i];if(i===2||i===5)o+='.';if(i===8)o+='-'}}else{for(let i=0;i<d.length;i++){o+=d[i];if(i===1||i===4)o+='.';if(i===7)o+='/';if(i===11)o+='-'}}el.value=o.replace(/[./-]$/,'')}
const cliKeys=()=>Object.keys(CLI).filter(k=>/^(\d{11}|\d{14})$/.test(k)&&CLI[k]&&CLI[k].name&&(ME.admin||CLI[k].by===S.seller)).sort((a,b)=>CLI[a].name.localeCompare(CLI[b].name));
function cliOpts(){return '<option value="">Selecione o cliente…</option>'+cliKeys().map(k=>`<option value="${k}">${esc(CLI[k].name)} · ${fmtCnpj(k)}</option>`).join('')}
function cliHint(){return cliKeys().length?'':'Nenhum cliente cadastrado. <a href="#" onclick="tab=\'cli\';render();return false" style="color:var(--ac)">Cadastre o primeiro pelo CNPJ ou CPF</a>.'}
function cliPick(p){const o=CLI[$('#'+(p==='s'?'sc':'qc')).value],e=$('#'+p+'cobs');if(e){e.textContent=o&&o.obs?'📌 Obs.: '+o.obs:'';flat(e)}}
async function saveCli(id,o){CLI[id]=o;try{if(DBH&&CATREF)await DBH.collection('clientes').doc(id).set(o);else localStorage.setItem('painel_cli',JSON.stringify(CLI))}catch(e){toast('Não foi possível salvar o cliente.')}}
async function addCli(){
  const d=dig($('#cc').value),name=$('#cn').value.trim(),obs=$('#co').value.trim(),area=($('#ca')?$('#ca').value:'').trim();
  if(!okDoc(d)){toast('CNPJ ou CPF inválido. Confira os números.');return}
  if(!name){toast('Informe o nome ou a razão social.');return}
  let ex=CLI[d];
  if(!ex&&DBH&&CATREF){try{const sn=await DBH.collection('clientes').doc(d).get();if(sn.exists){ex=cl(sn.data());CLI[d]=ex}}catch(e){}}
  if(ex){toast(ex.by&&ex.by===S.seller?'Este CNPJ/CPF já está na sua carteira: '+ex.name+'.':'Este CNPJ/CPF já está cadastrado na carteira de '+(ex.by||'outro vendedor')+': '+ex.name+'.');render();return}
  const ow=ME.admin&&$('#cv')?$('#cv').value:(S.seller||'');const sraw=($('#cs')?$('#cs').value:'').trim(),social=sraw?normUrl(sraw):'';if(sraw&&!social){toast('Link inválido. Cole o endereço completo do perfil (ex.: https://instagram.com/empresa).');return}
  let logo='';const lf=$('#cl')&&$('#cl').files[0];if(lf){try{logo=await readImg(lf,128)}catch(e){toast('Não foi possível ler a imagem. O cliente será cadastrado sem foto.')}}
  await saveCli(d,{cnpj:d,name,obs,area,social,logo,by:ow,at:today()});render();toast('Cliente cadastrado.');
}
async function quickCli(p){
  try{
    const d=dig($('#'+p+'nc').value),name=$('#'+p+'nn').value.trim();
    if(!okDoc(d)){toast('CNPJ ou CPF inválido. Confira os números.');return}
    if(!name){toast('Informe o nome ou a razão social.');return}
    let ex=CLI[d];
    if(!ex&&DBH&&CATREF){try{const sn=await DBH.collection('clientes').doc(d).get();if(sn.exists){ex=cl(sn.data());CLI[d]=ex}}catch(e){}}
    if(ex){toast(ex.by&&ex.by===S.seller?'Este CNPJ/CPF já está na sua carteira: '+ex.name+'.':'Este CNPJ/CPF já está cadastrado na carteira de '+(ex.by||'outro vendedor')+': '+ex.name+'.');return}
    await saveCli(d,{cnpj:d,name,obs:'',area:($('#'+p+'na')?$('#'+p+'na').value.trim():''),by:S.seller||'',at:today()});
    const sel=$('#'+(p==='s'?'sc':'qc'));sel.innerHTML=cliOpts();sel.value=d;cliPick(p);
    const h=$('#'+(p==='s'?'scobs':'qcobs'));if(h&&!h.textContent.startsWith('📌'))h.textContent='';
    $('#'+p+'nc').value='';$('#'+p+'nn').value='';if($('#'+p+'na'))$('#'+p+'na').value='';
    toast('Cliente cadastrado e selecionado.');
  }catch(e){toast('Não foi possível cadastrar o cliente: '+(e&&e.message||e))}
}

function cliRows(){

function addM(k,n){let y=+k.slice(0,4),m=+k.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0')}

function fatCard(){

function payCard(){

async function upl(inp){

  try{const u=await AS.upload(f);return{id:u.id,name:f.name}}

}

function seedCard(){
  const miss=SEED.filter(p=>!CAT.some(x=>x.id===p.id));
  if(!miss.length)return '';
  return `<div class="card"><h2>✨ Lista inicial de produtos</h2><div class="mu" style="margin-bottom:8px">${miss.length} ${miss.length===1?'produto pronto':'produtos prontos'} com nome, ID e foto: ${miss.map(p=>esc(p.name)).join(', ')}.</div><button class="btn" id="seedbtn" onclick="importSeed()">Importar produtos</button></div>`;
}
async function importSeed(){
  const b=$('#seedbtn');if(b){b.disabled=true;b.textContent='Importando…'}
  for(const p of SEED){if(CAT.some(x=>x.id===p.id))continue;CAT.push({id:p.id,name:p.name,price:0});await saveImg(p.id,p.img)}

function kpi(k,v,sub){return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${sub?`<div class="mu">${sub}</div>`:''}</div>`}
function goalBar(label,val,goal,fmt,color){

function chart(){
  const [y,m]=month.split('-').map(Number),ms=[];
  for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1);ms.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const vals=ms.map(k=>sum(V.sales.filter(s=>(s.date||'').slice(0,7)===k&&chOk(s.channel)&&(tipo==='todos'||s.type===tipo)&&(vend==='todos'||(s.seller||'Pamela')===vend))));
  const mx=Math.max(...vals,1);let g='';
  ms.forEach((k,i)=>{const h=Math.round(vals[i]/mx*120),x=20+i*95;
    g+=`<rect x="${x}" y="${150-h}" width="70" height="${h}" rx="6" fill="${k===month?'var(--ac)':'var(--bd)'}"/><text x="${x+35}" y="${142-h}" text-anchor="middle" font-size="11" fill="var(--tx)">${vals[i]?Math.round(vals[i]).toLocaleString('pt-BR'):''}</text><text x="${x+35}" y="170" text-anchor="middle" font-size="11" fill="var(--mu)">${k.slice(5)}/${k.slice(2,4)}</text>`});
  return `<svg viewBox="0 0 600 180" width="100%" role="img" aria-label="Faturamento dos últimos 6 meses">${g}</svg>`;
}
function lossCard(s){

  lost.forEach(q=>{const k=q.reason||'Sem motivo informado';(by[k]=by[k]||{n:0,v:0});by[k].n++;by[k].v+=+q.value||0});
  const rows=Object.entries(by).sort((a,b)=>b[1].n-a[1].n),mx=rows.length?rows[0][1].n:1;
  return `<div class="card"><h2>🚫 Motivos de não fechamento</h2>${rows.length?rows.map(([k,o])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(k)}</b><span class="mu">${o.n} ${o.n>1?'orçamentos':'orçamento'} · ${brl(o.v)} perdidos</span></div><div class="bar"><i style="width:${o.n/mx*100}%;background:${k==='Sem motivo informado'?'var(--mu)':'var(--bad)'}"></i></div></div>`).join(''):'<div class="mu">Nenhum orçamento perdido neste período.</div>'}</div>`;
}

function delQuote(id){
  const q=(S.quotes||[]).find(x=>x.id===id);if(!q)return;
  const sl=(S.sales||[]).find(x=>x.qid===id||(q.saleId&&x.id===q.saleId));
  const fin=async(withSale)=>{S.quotes=S.quotes.filter(x=>x.id!==id);if(withSale&&sl)S.sales=S.sales.filter(x=>x!==sl&&x.id!==sl.id);try{await save();render();toast(withSale&&sl?'Orçamento e venda excluídos.':'Orçamento excluído.')}catch(e){toast('Não foi possível excluir: '+(e&&e.message||e))}};
  if(!sl){ask('Excluir este orçamento?',()=>fin(false));return}
  const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px';
  o.innerHTML='<div class="card" style="max-width:400px;margin:0"><div style="margin-bottom:12px">Excluir o orçamento de <b id="dqn"></b>?</div><label style="flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--tx);margin-bottom:14px"><input type="checkbox" id="dqs" checked style="width:auto"><span id="dqt"></span></label><div class="row" style="justify-content:flex-end"><button class="btn" id="dqc" style="background:var(--bd);color:var(--tx)">Cancelar</button><button class="btn dg" id="dqy">Excluir</button></div></div>';
  document.body.appendChild(o);o.querySelector('#dqn').textContent=q.client||'cliente';o.querySelector('#dqt').textContent='Excluir também a venda vinculada ('+brl(sl.value)+')';
  o.querySelector('#dqc').onclick=()=>o.remove();
  o.querySelector('#dqy').onclick=()=>{const w=o.querySelector('#dqs').checked;o.remove();fin(w)};
}
function delSale(id,u){
  const mine=u===(ME.u||'me'),doc=mine?S:(ALL[u]||null);
  const r=doc&&(doc.sales||[]).find(x=>x.id===id);if(!r){toast('Venda não encontrada.');return}
  ask('Excluir a venda de '+(r.client||'cliente')+' ('+brl(r.value)+')?'+(r.qid?' O orçamento volta para "aberto".':''),async()=>{
    try{
      if(mine){
        const q=r.qid&&(S.quotes||[]).find(x=>x.id===r.qid);if(q){q.status='aberto';delete q.saleId}
        S.sales=S.sales.filter(x=>x.id!==id);await save();

      }else{toast('Você só pode excluir as suas vendas.');return}
      render();toast('Venda excluída.');
    }catch(e){toast('Não foi possível excluir: '+(e&&e.message||e))}
  });
}

  const q=FQ.toLowerCase(),l=FAQ.filter(x=>!q||(x.q+' '+x.a).toLowerCase().includes(q));
  if(!l.length)return `<div class="mu">${FAQ.length?'Nenhuma dúvida encontrada.':'Ainda não há dúvidas respondidas.'}</div>`;
  return l.map(x=>`<details open style="border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px"><summary style="cursor:pointer;font-weight:700">${esc(x.q)}</summary><div style="white-space:pre-wrap;margin-top:8px">${esc(x.a)}</div><div class="mu" style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${x.by?'Perguntada por '+esc(x.by)+' · ':''}${dTxt(x.ans||x.at)}${ME.admin?` <button class="btn" style="padding:3px 10px;font-size:12px" onclick="editFaq('${x.id}')">Editar</button> <button class="x" onclick="delFaq('${x.id}')" title="Excluir">✕</button>`:''}</div></details>`).join('');
}
function filterFaq(v){FQ=v;$('#faql').innerHTML=faqList()}
function vDuv(){
  const adm=ME.admin,pend=Object.entries(DP).sort((a,b)=>(a[1].at||0)-(b[1].at||0));
  const ask1=adm?`<div class="card"><h2>➕ Adicionar dúvida e resposta</h2><div class="row" style="flex-direction:column;align-items:stretch"><label>Pergunta<input id="fq" placeholder="Ex.: Como lanço um pedido com desconto?"></label><label>Resposta<textarea id="fa" rows="4" style="width:100%"></textarea></label><div><button class="btn" onclick="addFaq()">Publicar</button></div></div></div>`
  :`<div class="card"><h2>❓ Fazer uma pergunta</h2><div class="row" style="flex-direction:column;align-items:stretch"><label>Sua dúvida<textarea id="dq" rows="3" style="width:100%" placeholder="Escreva aqui a sua dúvida sobre o painel, preços, prazos, processos…"></textarea></label><div><button class="btn" onclick="askQ()">Enviar pergunta</button></div></div><div class="mu" style="margin-top:6px">As perguntas e respostas ficam visíveis para toda a equipe.</div></div>`;
  const pc=pend.length?`<div class="card"><h2>${adm?'📥 Perguntas aguardando resposta ('+pend.length+')':'⏳ Perguntas aguardando resposta ('+pend.length+')'}</h2>${pend.map(([id,x])=>`<div style="border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px"><div style="white-space:pre-wrap"><b>${esc(x.q)}</b></div><div class="mu">${esc(x.by||'—')} · ${dTxt(x.at)}</div>${adm?`<label style="margin-top:8px">Resposta<textarea id="da_${id}" rows="3" style="width:100%"></textarea></label><div class="row" style="margin-top:6px"><button class="btn" onclick="answerQ('${id}')">Responder</button><button class="x" onclick="delQ('${id}')" title="Excluir pergunta">✕</button></div>`:(x.by===S.seller?`<div style="margin-top:6px"><button class="x" onclick="delQ('${id}')" title="Cancelar pergunta">✕ cancelar</button></div>`:'')}</div>`).join('')}</div>`:'';
  return `${ask1}${pc}<div class="card"><h2>📚 Dúvidas respondidas (${FAQ.length})</h2><label style="margin-bottom:8px">🔎 Buscar<input value="${esc(FQ)}" oninput="filterFaq(this.value)" placeholder="Digite uma palavra"></label><div id="faql">${faqList()}</div></div>`;
}
function vMetas(){
  const g=S.goals;
  return `<div class="card"><h2>🎯 Metas mensais</h2><div class="row">
  <label>Faturamento (R$)<input type="number" min="0" id="g1" value="${g.revenue||''}"></label>
  <label>Clientes novos<input type="number" min="0" id="g2" value="${g.newClients||''}"></label>
  <label>Conversão de orçamentos (%)<input type="number" min="0" max="100" id="g3" value="${g.conversion||''}"></label>
  <label>Sua comissão (%)<input type="number" step="0.1" min="0" id="g4" value="${S.rate}"></label>
  <button class="btn" onclick="saveGoals()">Salvar metas</button></div>
  <div class="mu" style="margin-top:6px">As metas valem para todos os meses. O progresso aparece na aba Resumo.</div></div>${pinCard()}`;
}
function saveGoals(){S.goals={revenue:+$('#g1').value||0,newClients:+$('#g2').value||0,conversion:+$('#g3').value||0};S.rate=$('#g4').value===''?3:+$('#g4').value;save();tab='resumo';render()}
const _render0=render;render=function(){_render0();flat(document.querySelector('header'));flat($('#nav'));flat($('#app'))};
</script></body></html>
